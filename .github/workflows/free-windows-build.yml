name: Build CodexFF Free for Windows

on:
  push:
    branches:
      - main-free
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 bundle
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: CodexFF-Free-Windows-x64
          if-no-files-found: error
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
